<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPM Control — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <div id="sidebar-container"></div>
  <div class="main">
    <div class="topbar">
      <div class="tb-title">Dashboard</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="tb-chip" id="tb-fecha"></div>
        <div class="tb-chip" style="color:var(--green);"><span style="display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:4px;"></span>En vivo</div>
        <a href="ots.html" class="btn-p">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nueva OT
        </a>
      </div>
    </div>
    <div class="content">

      <!-- STATS -->
      <div class="g4" style="margin-bottom:22px;" id="stats-grid">
        <div class="sc fu" style="--sg:linear-gradient(90deg,#E84040,#F97316);">
          <div class="sc-glow" style="background:rgba(232,64,64,.15);"></div>
          <div class="sc-icon" style="color:#E84040;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
          <div class="sc-val" id="stat-clientes">—</div>
          <div class="sc-lbl">Clientes Activos</div>
          <div class="sc-delta" id="delta-clientes" style="color:var(--t3);">Cargando...</div>
        </div>
        <div class="sc fu" style="--sg:linear-gradient(90deg,#F59E0B,#FBBF24);">
          <div class="sc-glow" style="background:rgba(245,158,11,.15);"></div>
          <div class="sc-icon" style="color:#F59E0B;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg></div>
          <div class="sc-val" id="stat-ots">—</div>
          <div class="sc-lbl">OT Activas</div>
          <div class="sc-delta" id="delta-ots" style="color:var(--t3);">Cargando...</div>
        </div>
        <div class="sc fu" style="--sg:linear-gradient(90deg,#E84040,#C42F2F);">
          <div class="sc-glow" style="background:rgba(232,64,64,.15);"></div>
          <div class="sc-icon" style="color:#E84040;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
          <div class="sc-val" id="stat-alertas">—</div>
          <div class="sc-lbl">Alertas Activas</div>
          <div class="sc-delta" id="delta-alertas" style="color:var(--t3);">Cargando...</div>
        </div>
        <div class="sc fu" style="--sg:linear-gradient(90deg,#3B82F6,#60A5FA);">
          <div class="sc-glow" style="background:rgba(59,130,246,.15);"></div>
          <div class="sc-icon" style="color:#3B82F6;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
          <div class="sc-val" id="stat-costos">—</div>
          <div class="sc-lbl">Costo Mes Actual</div>
          <div class="sc-delta" id="delta-costos" style="color:var(--t3);">Cargando...</div>
        </div>
      </div>

      <div class="gm mt20">
        <!-- OTs RECIENTES -->
        <div class="card fu">
          <div class="card-hd">
            <div><div class="ctitle">Órdenes de Trabajo Activas</div><div class="csub" id="ots-sub">—</div></div>
            <a href="ots.html" class="tb-chip">Ver todas →</a>
          </div>
          <div style="overflow-x:auto;">
            <table class="tbl">
              <thead><tr><th>ID / Cliente</th><th>Técnico</th><th>Prioridad</th><th>Estado</th><th>Fecha</th></tr></thead>
              <tbody id="ots-tbody">
                <tr><td colspan="5"><div class="loading-center"><div class="spinner"></div><span>Cargando...</span></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- PANEL DERECHO -->
        <div style="display:flex;flex-direction:column;gap:20px;">
          <!-- ALERTAS -->
          <div class="card fu">
            <div class="card-hd">
              <div class="ctitle">Alertas Recientes</div>
              <a href="alertas.html" class="tb-chip">Ver todas</a>
            </div>
            <div id="alertas-list">
              <div class="loading-center"><div class="spinner"></div></div>
            </div>
          </div>
          <!-- PRÓXIMAS MANTENCIONES -->
          <div class="card fu">
            <div class="card-hd"><div class="ctitle">Próximas Mantenciones</div></div>
            <div id="mantenciones-list">
              <div class="loading-center"><div class="spinner"></div></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="sidebar.js"></script>
<script>
  const user = requireAuth();
  if (user) {
    renderSidebar('dashboard');
    cargarBadges();
    document.getElementById('tb-fecha').textContent = new Date().toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    cargarDashboard();
  }

  async function cargarDashboard() {
    const db = getDB();
    try {
      // Clientes activos
      const { count: cClientes } = await db.from('clientes').select('*',{count:'exact',head:true}).eq('estado','Activo');
      document.getElementById('stat-clientes').textContent = cClientes || 0;
      document.getElementById('delta-clientes').textContent = `Total registrados`;
      document.getElementById('delta-clientes').className = 'sc-delta';

      // OTs activas
      const { count: cOTs, data: otsData } = await db.from('ots')
        .select('*, clientes(nombre), tecnicos(perfil_id, perfiles(nombre))')
        .in('estado',['Abierta','En Progreso'])
        .order('creado_en',{ascending:false})
        .limit(5);
      document.getElementById('stat-ots').textContent = cOTs || 0;
      document.getElementById('delta-ots').textContent = 'Abiertas + En progreso';
      document.getElementById('ots-sub').textContent = `${cOTs || 0} órdenes activas`;
      renderOTs(otsData || []);

      // Alertas
      const { count: cAlertas, data: alertasData } = await db.from('alertas')
        .select('*, clientes(nombre)')
        .eq('leida', false)
        .order('creado_en',{ascending:false})
        .limit(3);
      document.getElementById('stat-alertas').textContent = cAlertas || 0;
      document.getElementById('delta-alertas').style.color = cAlertas > 0 ? 'var(--red)' : 'var(--green)';
      document.getElementById('delta-alertas').textContent = cAlertas > 0 ? `${cAlertas} sin revisar` : 'Sin alertas pendientes';
      renderAlertas(alertasData || []);

      // Costos del mes
      const ini = new Date(); ini.setDate(1); ini.setHours(0,0,0,0);
      const { data: costosData } = await db.from('ots')
        .select('costo_mano_obra,costo_repuestos,costo_otros')
        .gte('creado_en', ini.toISOString());
      const total = (costosData||[]).reduce((a,o) => a + (o.costo_mano_obra||0) + (o.costo_repuestos||0) + (o.costo_otros||0), 0);
      document.getElementById('stat-costos').textContent = fmtMoney(total);
      document.getElementById('delta-costos').textContent = 'Este mes';

      // Próximas mantenciones
      const { data: mantData } = await db.from('activos')
        .select('nombre, proximo_mantenimiento, clientes(nombre)')
        .gte('proximo_mantenimiento', new Date().toISOString().split('T')[0])
        .order('proximo_mantenimiento',{ascending:true})
        .limit(4);
      renderMantenciones(mantData || []);

    } catch(e) {
      console.error(e);
      showToast('Error cargando datos', 'error');
    }
  }

  function renderOTs(ots) {
    const tb = document.getElementById('ots-tbody');
    if (!ots.length) {
      tb.innerHTML = `<tr><td colspan="5"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></svg><span>Sin órdenes activas</span></div></td></tr>`;
      return;
    }
    tb.innerHTML = ots.map(o => `
      <tr onclick="window.location='ots.html?id=${o.id}'" style="cursor:pointer">
        <td><div style="font-weight:600;color:var(--t1);">${o.numero || '—'}</div><div style="font-size:11px;color:var(--t3);">${o.clientes?.nombre || '—'}</div></td>
        <td>${o.tecnicos?.perfiles?.nombre || '—'}</td>
        <td>${badgeEstado(o.prioridad)}</td>
        <td>${badgeEstado(o.estado)}</td>
        <td style="font-size:12px;color:var(--t3);">${fmtFecha(o.fecha_programada)}</td>
      </tr>`).join('');
  }

  function renderAlertas(alertas) {
    const el = document.getElementById('alertas-list');
    if (!alertas.length) {
      el.innerHTML = `<div class="empty-state" style="height:100px;"><span style="color:var(--green);font-size:13px;">✓ Sin alertas pendientes</span></div>`;
      return;
    }
    const tipos = { critica:'crit', alta:'warn', info:'info' };
    const iconos = {
      critica: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
      alta:    '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
      info:    '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="8"/><line x1="12" y1="12" x2="12" y2="16"/>'
    };
    el.innerHTML = alertas.map(a => `
      <div class="ali ${tipos[a.tipo]||'info'}">
        <div class="ali-ic ${a.tipo==='critica'?'blink-r':''}" style="color:${a.tipo==='critica'?'var(--red)':a.tipo==='alta'?'var(--yellow)':'var(--blue)'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${iconos[a.tipo]||iconos.info}</svg>
        </div>
        <div class="ali-b">
          <div class="ali-title">${a.titulo}</div>
          <div class="ali-desc">${a.clientes?.nombre || ''}</div>
        </div>
        <div class="ali-time">${fmtFecha(a.creado_en)}</div>
      </div>`).join('');
  }

  function renderMantenciones(items) {
    const el = document.getElementById('mantenciones-list');
    if (!items.length) {
      el.innerHTML = `<div class="empty-state" style="height:100px;"><span style="font-size:13px;color:var(--t3);">Sin mantenciones próximas</span></div>`;
      return;
    }
    el.innerHTML = items.map(m => {
      const d = new Date(m.proximo_mantenimiento + 'T00:00:00');
      const meses = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
      return `
        <div class="mant-item">
          <div class="mant-fecha">
            <div class="mant-day">${d.getDate()}</div>
            <div class="mant-mon">${meses[d.getMonth()]}</div>
          </div>
          <div class="mant-info">
            <div class="mant-nombre">${m.nombre}</div>
            <div class="mant-ot">${m.clientes?.nombre || '—'}</div>
          </div>
        </div>`;
    }).join('');
  }
</script>
</body>
</html>
