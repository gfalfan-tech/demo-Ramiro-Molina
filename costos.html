<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPM Control — Costos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <div id="sidebar-container"></div>
  <div class="main">
    <div class="topbar">
      <div class="tb-title">Análisis de Costos</div>
      <div style="display:flex;gap:10px;">
        <select id="filtro-periodo" class="tb-chip" style="cursor:pointer;border:1px solid var(--bd2);">
          <option value="mes">Este mes</option>
          <option value="trimestre">Este trimestre</option>
          <option value="anio">Este año</option>
        </select>
        <select id="filtro-cliente" class="tb-chip" style="cursor:pointer;border:1px solid var(--bd2);">
          <option value="">Todos los clientes</option>
        </select>
      </div>
    </div>
    <div class="content">

      <!-- STATS -->
      <div class="g4" style="margin-bottom:22px;">
        <div class="sc fu" style="--sg:linear-gradient(90deg,#E84040,#F97316);">
          <div class="sc-glow" style="background:rgba(232,64,64,.15);"></div>
          <div class="sc-icon" style="color:#E84040;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div>
          <div class="sc-val" id="costo-total">—</div>
          <div class="sc-lbl">Costo Total</div>
          <div class="sc-delta" id="costo-total-sub" style="color:var(--t3);">Cargando...</div>
        </div>
        <div class="sc fu" style="--sg:linear-gradient(90deg,#F59E0B,#FBBF24);">
          <div class="sc-glow" style="background:rgba(245,158,11,.15);"></div>
          <div class="sc-icon" style="color:#F59E0B;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
          <div class="sc-val" id="costo-mo">—</div>
          <div class="sc-lbl">Mano de Obra</div>
          <div class="sc-delta" id="costo-mo-sub" style="color:var(--t3);">—</div>
        </div>
        <div class="sc fu" style="--sg:linear-gradient(90deg,#3B82F6,#60A5FA);">
          <div class="sc-glow" style="background:rgba(59,130,246,.15);"></div>
          <div class="sc-icon" style="color:#3B82F6;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
          <div class="sc-val" id="costo-rep">—</div>
          <div class="sc-lbl">Repuestos</div>
          <div class="sc-delta" id="costo-rep-sub" style="color:var(--t3);">—</div>
        </div>
        <div class="sc fu" style="--sg:linear-gradient(90deg,#10B981,#34D399);">
          <div class="sc-glow" style="background:rgba(16,185,129,.15);"></div>
          <div class="sc-icon" style="color:#10B981;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
          <div class="sc-val" id="costo-prom">—</div>
          <div class="sc-lbl">Costo Prom. / OT</div>
          <div class="sc-delta" id="costo-prom-sub" style="color:var(--t3);">—</div>
        </div>
      </div>

      <div class="g2">
        <!-- DESGLOSE POR CLIENTE -->
        <div class="card fu">
          <div class="card-hd"><div><div class="ctitle">Costo por Cliente</div><div class="csub">Ordenado por mayor gasto</div></div></div>
          <div id="costos-clientes"></div>
        </div>

        <!-- DESGLOSE POR TIPO -->
        <div class="card fu">
          <div class="card-hd"><div><div class="ctitle">Desglose por Tipo de OT</div></div></div>
          <div id="costos-tipos"></div>
        </div>
      </div>

      <!-- TABLA DETALLADA -->
      <div class="card mt20 fu">
        <div class="card-hd">
          <div><div class="ctitle">Detalle por OT</div><div class="csub" id="tabla-sub">—</div></div>
        </div>
        <div style="overflow-x:auto;">
          <table class="tbl">
            <thead>
              <tr><th>Número</th><th>Descripción</th><th>Cliente</th><th>Tipo</th><th>M. de Obra</th><th>Repuestos</th><th>Otros</th><th>Total</th></tr>
            </thead>
            <tbody id="costos-tbody">
              <tr><td colspan="8"><div class="loading-center"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="auth.js"></script><script src="sidebar.js"></script>
<script>
const user = requireAuth();
if (user) {
  renderSidebar('costos'); cargarBadges();
  cargarClientes().then(() => cargarCostos());
}
document.getElementById('filtro-periodo').addEventListener('change', cargarCostos);
document.getElementById('filtro-cliente').addEventListener('change', cargarCostos);

async function cargarClientes() {
  const { data } = await getDB().from('clientes').select('id,nombre').eq('estado','Activo').order('nombre');
  const sel = document.getElementById('filtro-cliente');
  (data||[]).forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.nombre;
    sel.appendChild(opt);
  });
}

async function cargarCostos() {
  const db = getDB();
  const periodo = document.getElementById('filtro-periodo').value;
  const clienteId = document.getElementById('filtro-cliente').value;
  const hoy = new Date();
  let desde = new Date();
  if (periodo === 'mes') desde.setDate(1);
  else if (periodo === 'trimestre') desde.setMonth(hoy.getMonth()-2, 1);
  else desde.setMonth(0, 1);
  desde.setHours(0,0,0,0);

  let q = db.from('ots').select('*, clientes(nombre)')
    .gte('creado_en', desde.toISOString())
    .order('creado_en', { ascending: false });
  if (clienteId) q = q.eq('cliente_id', clienteId);
  const { data: ots } = await q;

  const lista = ots || [];
  const totalMO  = lista.reduce((a,o) => a+(o.costo_mano_obra||0), 0);
  const totalRep = lista.reduce((a,o) => a+(o.costo_repuestos||0), 0);
  const totalOtros = lista.reduce((a,o) => a+(o.costo_otros||0), 0);
  const total = totalMO + totalRep + totalOtros;
  const conCosto = lista.filter(o => (o.costo_mano_obra||0)+(o.costo_repuestos||0)+(o.costo_otros||0) > 0);

  document.getElementById('costo-total').textContent = fmtMoney(total);
  document.getElementById('costo-total-sub').textContent = `${lista.length} OT en el período`;
  document.getElementById('costo-mo').textContent = fmtMoney(totalMO);
  document.getElementById('costo-mo-sub').textContent = total > 0 ? Math.round(totalMO/total*100)+'% del total' : '—';
  document.getElementById('costo-rep').textContent = fmtMoney(totalRep);
  document.getElementById('costo-rep-sub').textContent = total > 0 ? Math.round(totalRep/total*100)+'% del total' : '—';
  document.getElementById('costo-prom').textContent = conCosto.length > 0 ? fmtMoney(Math.round(total/conCosto.length)) : '—';
  document.getElementById('costo-prom-sub').textContent = `${conCosto.length} OT con costo registrado`;
  document.getElementById('tabla-sub').textContent = `${lista.length} órdenes — total ${fmtMoney(total)}`;

  // Por cliente
  const porCliente = {};
  lista.forEach(o => {
    const n = o.clientes?.nombre || 'Sin cliente';
    porCliente[n] = (porCliente[n]||0) + (o.costo_mano_obra||0)+(o.costo_repuestos||0)+(o.costo_otros||0);
  });
  const topCls = Object.entries(porCliente).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxCl = topCls[0]?.[1] || 1;
  document.getElementById('costos-clientes').innerHTML = topCls.length
    ? topCls.map(([n,c]) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);">
          <div style="flex:1;"><div style="font-size:13.5px;font-weight:600;color:var(--t1);">${n}</div>
            <div class="pr-bg" style="margin-top:6px;"><div class="pr-fill" style="width:${c/maxCl*100}%;background:linear-gradient(90deg,#E84040,#F97316);"></div></div>
          </div>
          <div style="font-family:var(--fd);font-size:16px;font-weight:800;color:var(--red);margin-left:16px;">${fmtMoney(c)}</div>
        </div>`).join('')
    : '<div class="empty-state" style="height:100px;"><span style="font-size:13px;color:var(--t3);">Sin datos en el período</span></div>';

  // Por tipo
  const porTipo = {};
  lista.forEach(o => {
    const t = o.tipo || 'Sin tipo';
    porTipo[t] = (porTipo[t]||0) + (o.costo_mano_obra||0)+(o.costo_repuestos||0)+(o.costo_otros||0);
  });
  const topTipos = Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);
  const maxT = topTipos[0]?.[1] || 1;
  const colores = ['linear-gradient(90deg,#E84040,#F97316)','linear-gradient(90deg,#3B82F6,#60A5FA)','linear-gradient(90deg,#10B981,#34D399)','linear-gradient(90deg,#F59E0B,#FBBF24)'];
  document.getElementById('costos-tipos').innerHTML = topTipos.length
    ? topTipos.map(([t,c],i) => `
        <div class="pr" style="margin-bottom:18px;">
          <span class="pr-lbl" style="flex:0 0 120px;">${t}</span>
          <div class="pr-bg"><div class="pr-fill" style="width:${c/maxT*100}%;background:${colores[i%4]};"></div></div>
          <span style="font-size:12px;font-weight:600;color:var(--t1);flex:0 0 80px;text-align:right;">${fmtMoney(c)}</span>
        </div>`).join('')
    : '<div class="empty-state" style="height:100px;"><span style="font-size:13px;color:var(--t3);">Sin datos</span></div>';

  // Tabla
  const tb = document.getElementById('costos-tbody');
  if (!lista.length) {
    tb.innerHTML = `<tr><td colspan="8"><div class="empty-state"><span style="font-size:13px;color:var(--t3);">Sin órdenes en el período</span></div></td></tr>`;
    return;
  }
  tb.innerHTML = lista.map(o => {
    const tot = (o.costo_mano_obra||0)+(o.costo_repuestos||0)+(o.costo_otros||0);
    return `<tr>
      <td style="font-family:var(--fd);color:var(--red);">${o.numero||'—'}</td>
      <td>${o.nombre}</td>
      <td style="font-size:12.5px;">${o.clientes?.nombre||'—'}</td>
      <td>${badgeEstado(o.tipo||'—')}</td>
      <td style="font-size:12.5px;">${o.costo_mano_obra > 0 ? fmtMoney(o.costo_mano_obra) : '—'}</td>
      <td style="font-size:12.5px;">${o.costo_repuestos > 0 ? fmtMoney(o.costo_repuestos) : '—'}</td>
      <td style="font-size:12.5px;">${o.costo_otros > 0 ? fmtMoney(o.costo_otros) : '—'}</td>
      <td style="font-weight:700;color:${tot>0?'var(--t1)':'var(--t3)'};">${tot > 0 ? fmtMoney(tot) : '—'}</td>
    </tr>`;
  }).join('');
}
</script>
</body>
</html>
