<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPM Control — Inventario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <div id="sidebar-container"></div>
  <div class="main">
    <div class="topbar">
      <div class="tb-title">Inventario</div>
      <div style="display:flex;gap:10px;">
        <input type="text" id="buscador" placeholder="Buscar..." style="padding:8px 14px;background:var(--s2);border:1px solid var(--bd);border-radius:20px;color:var(--t1);font-family:var(--fb);font-size:13px;outline:none;width:180px;" onfocus="this.style.borderColor='var(--red)'" onblur="this.style.borderColor='var(--bd)'">
        <select id="filtro-cat" class="tb-chip" style="cursor:pointer;border:1px solid var(--bd2);"><option value="">Todas las categorías</option></select>
        <button class="btn-p" onclick="abrirModal()" id="btn-nuevo" style="display:none">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Nuevo Item
        </button>
      </div>
    </div>
    <div class="content">
      <div class="g4" style="margin-bottom:22px;">
        <div class="sc fu" style="--sg:linear-gradient(90deg,#3B82F6,#60A5FA);"><div class="sc-icon" style="color:#3B82F6;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div><div class="sc-val" id="stat-items">—</div><div class="sc-lbl">Items Totales</div></div>
        <div class="sc fu" style="--sg:linear-gradient(90deg,#E84040,#F97316);"><div class="sc-icon" style="color:#E84040;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></div><div class="sc-val" id="stat-criticos">—</div><div class="sc-lbl">Stock Crítico</div></div>
        <div class="sc fu" style="--sg:linear-gradient(90deg,#F59E0B,#FBBF24);"><div class="sc-icon" style="color:#F59E0B;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><div class="sc-val" id="stat-bajo">—</div><div class="sc-lbl">Stock Bajo</div></div>
        <div class="sc fu" style="--sg:linear-gradient(90deg,#10B981,#34D399);"><div class="sc-icon" style="color:#10B981;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div class="sc-val" id="stat-valor">—</div><div class="sc-lbl">Valor Total</div></div>
      </div>
      <div class="card fu">
        <div class="card-hd"><div><div class="ctitle">Inventario de Materiales y Repuestos</div><div class="csub" id="inv-sub">—</div></div></div>
        <div style="overflow-x:auto;">
          <table class="tbl">
            <thead><tr><th>Item</th><th>Categoría</th><th>Stock</th><th>Unidad</th><th>Stock Mínimo</th><th>Proveedor</th><th>P. Unitario</th><th>Valor Total</th><th>Estado</th><th></th></tr></thead>
            <tbody id="inv-tbody"><tr><td colspan="10"><div class="loading-center"><div class="spinner"></div></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-ov" id="modal-inv">
  <div class="modal-box" style="width:580px;">
    <div class="modal-hd"><div><div class="modal-title" id="modal-titulo">Nuevo Item</div></div><button class="modal-close" onclick="cerrarModal()">✕</button></div>
    <div class="modal-body">
      <input type="hidden" id="f-id">
      <div class="fg"><label class="fl">Nombre *</label><input type="text" class="fi" id="f-nombre" placeholder="Ej: Extintor ABC 6kg"></div>
      <div class="frow">
        <div class="fg"><label class="fl">Categoría</label><input type="text" class="fi" id="f-cat" list="cats-list" placeholder="Ej: Extintores">
          <datalist id="cats-list"></datalist>
        </div>
        <div class="fg"><label class="fl">Proveedor</label><input type="text" class="fi" id="f-proveedor" placeholder="Nombre del proveedor"></div>
      </div>
      <div class="frow3">
        <div class="fg"><label class="fl">Stock Actual</label><input type="number" class="fi" id="f-stock" value="0" min="0" step="0.01"></div>
        <div class="fg"><label class="fl">Stock Mínimo</label><input type="number" class="fi" id="f-stock-min" value="0" min="0" step="0.01"></div>
        <div class="fg"><label class="fl">Unidad</label><select class="fs" id="f-unidad"><option>unidad</option><option>kg</option><option>litro</option><option>metro</option><option>caja</option><option>par</option><option>rollo</option></select></div>
      </div>
      <div class="fg"><label class="fl">Precio Unitario</label><input type="number" class="fi" id="f-precio" value="0" min="0" placeholder="0"></div>
    </div>
    <div class="modal-ft">
      <button class="btn-s" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-p" onclick="guardarItem()" id="btn-guardar">Guardar Item</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="auth.js"></script><script src="sidebar.js"></script>
<script>
let ITEMS = [];
const user = requireAuth();
if (user) {
  renderSidebar('inventario'); cargarBadges();
  if (user.rol !== 'tecnico') document.getElementById('btn-nuevo').style.display = 'inline-flex';
  cargarInventario();
}
document.getElementById('buscador').addEventListener('input', filtrar);
document.getElementById('filtro-cat').addEventListener('change', filtrar);

async function cargarInventario() {
  const {data} = await getDB().from('inventario').select('*').order('nombre');
  ITEMS = data || [];
  // Stats
  const criticos = ITEMS.filter(i => i.stock === 0).length;
  const bajos = ITEMS.filter(i => i.stock > 0 && i.stock <= i.stock_minimo).length;
  const valor = ITEMS.reduce((a,i) => a+(i.stock||0)*(i.precio_unitario||0), 0);
  document.getElementById('stat-items').textContent = ITEMS.length;
  document.getElementById('stat-criticos').textContent = criticos;
  document.getElementById('stat-bajo').textContent = bajos;
  document.getElementById('stat-valor').textContent = fmtMoney(valor);
  document.getElementById('inv-sub').textContent = `${ITEMS.length} items registrados`;
  // Categorías
  const cats = [...new Set(ITEMS.map(i=>i.categoria).filter(Boolean))];
  const sel = document.getElementById('filtro-cat');
  sel.innerHTML = '<option value="">Todas las categorías</option>' + cats.map(c=>`<option value="${c}">${c}</option>`).join('');
  const dl = document.getElementById('cats-list');
  dl.innerHTML = cats.map(c=>`<option value="${c}">`).join('');
  filtrar();
}

function filtrar() {
  const txt = document.getElementById('buscador').value.toLowerCase();
  const cat = document.getElementById('filtro-cat').value;
  const f = ITEMS.filter(i => (!txt||(i.nombre||'').toLowerCase().includes(txt)) && (!cat||i.categoria===cat));
  renderTabla(f);
}

function renderTabla(lista) {
  const tb = document.getElementById('inv-tbody');
  if (!lista.length) { tb.innerHTML=`<tr><td colspan="10"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg><span>Sin items encontrados</span></div></td></tr>`; return; }
  tb.innerHTML = lista.map(i => {
    const agotado = i.stock === 0;
    const bajo = !agotado && i.stock <= i.stock_minimo;
    const estadoText = agotado ? 'Sin stock' : bajo ? 'Stock bajo' : 'Normal';
    const estadoBadge = agotado ? 'b-crit' : bajo ? 'b-warn' : 'b-ok';
    const valorTotal = (i.stock||0)*(i.precio_unitario||0);
    return `<tr>
      <td><div style="font-weight:600;color:var(--t1);">${i.nombre}</div></td>
      <td style="font-size:12.5px;">${i.categoria||'—'}</td>
      <td style="font-weight:700;color:${agotado?'var(--red)':bajo?'var(--yellow)':'var(--t1)'};">${i.stock}</td>
      <td style="font-size:12.5px;color:var(--t3);">${i.unidad}</td>
      <td style="font-size:12.5px;color:var(--t3);">${i.stock_minimo}</td>
      <td style="font-size:12.5px;">${i.proveedor||'—'}</td>
      <td style="font-size:12.5px;">${i.precio_unitario > 0 ? fmtMoney(i.precio_unitario) : '—'}</td>
      <td style="font-weight:600;color:var(--t1);">${valorTotal > 0 ? fmtMoney(valorTotal) : '—'}</td>
      <td><span class="badge ${estadoBadge}">${estadoText}</span></td>
      <td>
        <div style="display:flex;gap:4px;">
          ${user.rol!=='tecnico'?`<button class="icon-btn" onclick="editarItem('${i.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>`:''}
          ${user.rol==='admin'?`<button class="icon-btn" onclick="eliminarItem('${i.id}')" style="color:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H5L4 6"/></svg></button>`:''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function abrirModal(item=null) {
  document.getElementById('f-id').value=''; document.getElementById('f-nombre').value='';
  document.getElementById('f-cat').value=''; document.getElementById('f-proveedor').value='';
  document.getElementById('f-stock').value=0; document.getElementById('f-stock-min').value=0;
  document.getElementById('f-precio').value=0; document.getElementById('f-unidad').value='unidad';
  document.getElementById('modal-titulo').textContent='Nuevo Item';
  if (item) {
    document.getElementById('modal-titulo').textContent='Editar Item';
    document.getElementById('f-id').value=item.id;
    document.getElementById('f-nombre').value=item.nombre||'';
    document.getElementById('f-cat').value=item.categoria||'';
    document.getElementById('f-proveedor').value=item.proveedor||'';
    document.getElementById('f-stock').value=item.stock||0;
    document.getElementById('f-stock-min').value=item.stock_minimo||0;
    document.getElementById('f-precio').value=item.precio_unitario||0;
    document.getElementById('f-unidad').value=item.unidad||'unidad';
  }
  document.getElementById('modal-inv').classList.add('open');
}
function cerrarModal(){document.getElementById('modal-inv').classList.remove('open');}
function editarItem(id){const i=ITEMS.find(x=>x.id===id);if(i)abrirModal(i);}
async function guardarItem(){
  const nombre=document.getElementById('f-nombre').value.trim();
  if(!nombre){showToast('El nombre es obligatorio','error');return;}
  const db=getDB();
  const payload={nombre,categoria:document.getElementById('f-cat').value||null,proveedor:document.getElementById('f-proveedor').value||null,stock:parseFloat(document.getElementById('f-stock').value)||0,stock_minimo:parseFloat(document.getElementById('f-stock-min').value)||0,precio_unitario:parseFloat(document.getElementById('f-precio').value)||0,unidad:document.getElementById('f-unidad').value,actualizado_en:new Date().toISOString()};
  const id=document.getElementById('f-id').value;
  const{error}=id?await db.from('inventario').update(payload).eq('id',id):await db.from('inventario').insert(payload);
  if(error){showToast('Error: '+error.message,'error');return;}
  showToast(id?'Item actualizado':'Item creado','ok');cerrarModal();cargarInventario();
}
async function eliminarItem(id){
  if(!confirm('¿Eliminar este item?'))return;
  await getDB().from('inventario').delete().eq('id',id);
  showToast('Item eliminado','ok');cargarInventario();
}
document.getElementById('modal-inv').addEventListener('click',function(e){if(e.target===this)cerrarModal();});
</script>
</body>
</html>
